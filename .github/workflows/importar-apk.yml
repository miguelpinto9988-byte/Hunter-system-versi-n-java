name: Importar archivos de Hunter System 38.79
on:
  push:
    paths:
      - 'transfer_parts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Verificar y extraer respaldo
        shell: bash
        run: |
          set -euo pipefail
          count=$(find transfer_parts -maxdepth 1 -name 'part-*.bin' -type f | wc -l)
          test "$count" -eq 87
          find transfer_parts -maxdepth 1 -name 'part-*.bin' -type f -print0 | sort -z | xargs -0 cat > /tmp/hunter_system_3879.zip
          echo '8cb31c387322f21ba5239f9719613c35cb2d1baad5493bf711424669ee8ffd5c  /tmp/hunter_system_3879.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('/tmp/hunter_system_3879.zip') as archive:
              assert archive.testzip() is None, 'Archivo ZIP dañado'
              for name in archive.namelist():
                  p=Path(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise RuntimeError(f'Ruta insegura: {name}')
              archive.extractall('.')
          PY
      - name: Verificar hashes de todos los archivos exportados
        run: python3 tools/verificar_contenido.py
      - name: Publicar el código y eliminar fragmentos temporales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q transfer_parts
          git add -A
          git commit -m "Publicar Hunter System 38.79: código, animaciones y recursos"
          git push origin HEAD:main
