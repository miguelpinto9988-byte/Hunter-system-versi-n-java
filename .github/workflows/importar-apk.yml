name: Importar archivos de Hunter System 38.79
on:
  push:
    paths:
      - 'transfer_parts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Comprobar y descomprimir respaldo
        shell: bash
        run: |
          set -euo pipefail
          test -d transfer_parts
          count=$(find transfer_parts -maxdepth 1 -name 'part-*.bin' -type f | wc -l)
          test "$count" -eq 83
          find transfer_parts -maxdepth 1 -name 'part-*.bin' -type f -print0 | sort -z | xargs -0 cat > /tmp/hunter_system_3879.zip
          echo '8cb31c387322f21ba5239f9719613c35cb2d1baad5493bf711424669ee8ffd5c  /tmp/hunter_system_3879.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          source=Path('/tmp/hunter_system_3879.zip')
          with ZipFile(source) as archive:
              if archive.testzip() is not None:
                  raise RuntimeError('Un archivo del paquete está dañado')
              for name in archive.namelist():
                  path=Path(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise RuntimeError(f'Ruta no permitida: {name}')
              archive.extractall('.')
          PY
      - name: Verificar archivos extraídos
        run: python3 tools/verificar_contenido.py
      - name: Publicar archivos sin los fragmentos temporales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q transfer_parts
          git add -A
          git commit -m "Importar código y recursos Hunter System 38.79 desde APK"
          git push origin HEAD:main
